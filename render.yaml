services:
  - type: web
    name: whatsapp-suite
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MAX_WHATSAPP_ACCOUNTS
        value: 25
      - key: MAX_AVATAR_SIZE_MB
        value: 5
      - key: OTP_EXPIRY_MINUTES
        value: 10
      - key: WA_OTP_TEMPLATE
        value: otp_verification
      - key: FROM_EMAIL
        value: noreply@acquihiretech.com
      - key: FROM_NAME
        value: WhatsApp Suite by AcquiHire Tech
      - key: BASE_URL
        value: https://wa.acquihiretech.com
      # Set these manually in the Render dashboard (marked sync:false = secret):
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_ACCESS_TOKEN
        sync: false
